name: Observability CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8
      - name: Run Python observability tests
        run: |
          python -m flake8 scripts/observability tests/observability
          python -m pytest -q -ra tests/observability
      - name: Run Node web tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/observability/test_web.mjs
